# /etc/ssh/sshd_config.d/00-hardening.conf
# Real administration SSH (port 22) - key-based authentication only.
# Named "00-" so it is read first: in sshd, the first value found wins,
# which overrides any later file (e.g. 50-cloud-init.conf) re-enabling passwords.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
